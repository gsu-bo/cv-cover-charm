name: One-off Masonry Renderer Repair

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/one-off-masonry-renderer-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore prior renderer and apply minimal Masonry patch
        run: |
          git show 12878e5da965f6dd8318ce998008b968c814c36d:src/components/cv/CvCanvasBase.tsx > src/components/cv/CvCanvasBase.tsx
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/cv/CvCanvasBase.tsx")
          text = path.read_text()

          def replace_once(old: str, new: str):
              global text
              if text.count(old) != 1:
                  raise SystemExit(f"expected one match, got {text.count(old)} for: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
              '  type CvSectionLayout,\n  type CvSectionKey,',
              '  type CvSectionLayout,\n  type CvSectionPacking,\n  type CvSectionKey,',
          )

          replace_once(
              '      value.width !== "full" ||\n      value.positioning !== "flow"\n',
              '      value.width !== "full" ||\n      value.positioning !== "flow" ||\n      value.packing !== "rows"\n',
          )

          replace_once(
              '  type SectionUnit = {\n    key: CvLayoutSectionKey;\n    width: "full" | "half";\n    minPage: 0 | 1;\n    rows: Row[];\n  };',
              '  type SectionUnit = {\n    key: CvLayoutSectionKey;\n    width: "full" | "half";\n    packing: CvSectionPacking;\n    minPage: 0 | 1;\n    rows: Row[];\n  };',
          )

          replace_once(
              '      data-cv-rubric={unit.key}\n      data-cv-section-width={unit.width}\n',
              '      data-cv-rubric={unit.key}\n      data-cv-section-width={unit.width}\n      data-cv-section-packing={unit.packing}\n',
          )

          old_pack = '''  /** CSS Grid-Regeln als echte Zeilen packen – ohne absolute Positionierung. */
  const packSectionUnits = (units: SectionUnit[]): Row[] => {
    const packed: Row[] = [];
    let waiting: SectionUnit | null = null;
    const add = (items: SectionUnit[]) => {
      const id = `layout-${items.map((item) => item.key).join("-")}`;
      packed.push({
        id,
        minPage: items[0].minPage,
        node: (
          <div
            data-cv-section-row
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
              columnGap: "6mm",
              alignItems: "start",
            }}
          >
            {items.map((item) => (
              <div
                key={item.key}
                style={{ gridColumn: item.width === "full" ? "1 / -1" : "span 1", minWidth: 0 }}
              >
                {sectionNode(item)}
              </div>
            ))}
          </div>
        ),
      });
    };

    for (const unit of units) {
      if (unit.width === "full") {
        if (waiting) add([waiting]);
        waiting = null;
        add([unit]);
      } else if (waiting) {
        add([waiting, unit]);
        waiting = null;
      } else {
        waiting = unit;
      }
    }
    if (waiting) add([waiting]);
    return packed;
  };'''

          new_pack = '''  /**
   * Normale Halbbreiten bleiben in sicheren Zeilen. Zusammenhängende
   * Masonry-Rubriken laufen dagegen in zwei unabhängigen Spalten; die nächste
   * Rubrik geht jeweils in die aktuell kürzere Spalte.
   */
  const packSectionUnits = (units: SectionUnit[]): Row[] => {
    const packed: Row[] = [];
    let waiting: SectionUnit | null = null;
    let masonry: SectionUnit[] = [];

    const addRow = (items: SectionUnit[]) => {
      const id = `layout-${items.map((item) => item.key).join("-")}`;
      packed.push({
        id,
        minPage: items[0].minPage,
        node: (
          <div
            data-cv-section-row
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
              columnGap: "6mm",
              alignItems: "start",
            }}
          >
            {items.map((item) => (
              <div
                key={item.key}
                style={{ gridColumn: item.width === "full" ? "1 / -1" : "span 1", minWidth: 0 }}
              >
                {sectionNode(item)}
              </div>
            ))}
          </div>
        ),
      });
    };

    const flushWaiting = () => {
      if (!waiting) return;
      addRow([waiting]);
      waiting = null;
    };

    const flushMasonry = () => {
      if (!masonry.length) return;
      if (masonry.length === 1) {
        addRow(masonry);
        masonry = [];
        return;
      }

      const columns: [SectionUnit[], SectionUnit[]] = [[], []];
      const columnWeights: [number, number] = [0, 0];
      for (const item of masonry) {
        const target: 0 | 1 = columnWeights[0] <= columnWeights[1] ? 0 : 1;
        columns[target].push(item);
        columnWeights[target] += Math.max(1, item.rows.length);
      }

      packed.push({
        id: `masonry-${masonry.map((item) => item.key).join("-")}`,
        minPage: masonry[0].minPage,
        node: (
          <div
            data-cv-section-masonry
            style={{
              display: "grid",
              gridTemplateColumns: "repeat(2, minmax(0, 1fr))",
              columnGap: "6mm",
              alignItems: "start",
            }}
          >
            {columns.map((column, index) => (
              <div
                key={index}
                data-cv-masonry-column={index + 1}
                style={{ display: "flex", flexDirection: "column", minWidth: 0 }}
              >
                {column.map((item) => (
                  <div key={item.key} style={{ minWidth: 0 }}>
                    {sectionNode(item)}
                  </div>
                ))}
              </div>
            ))}
          </div>
        ),
      });
      masonry = [];
    };

    for (const unit of units) {
      if (unit.width === "half" && unit.packing === "masonry") {
        flushWaiting();
        masonry.push(unit);
        continue;
      }

      flushMasonry();
      if (unit.width === "full") {
        flushWaiting();
        addRow([unit]);
      } else if (waiting) {
        addRow([waiting, unit]);
        waiting = null;
      } else {
        waiting = unit;
      }
    }
    flushMasonry();
    flushWaiting();
    return packed;
  };'''
          replace_once(old_pack, new_pack)

          replace_once(
              '            key: "person",\n            width: personLayout.width,\n            minPage:',
              '            key: "person",\n            width: personLayout.width,\n            packing: "rows",\n            minPage:',
          )

          replace_once(
              '        key,\n        width: sectionLayout.width,\n        minPage:',
              '        key,\n        width: sectionLayout.width,\n        packing: layout === "classic" ? sectionLayout.packing : "rows",\n        minPage:',
          )

          replace_once(
              '      return `${key}:${value.page}:${value.width}:${value.positioning}:${value.x}:${value.y}:${value.widthMm}:${value.heightMm}`;',
              '      return `${key}:${value.page}:${value.width}:${value.positioning}:${value.packing}:${value.x}:${value.y}:${value.widthMm}:${value.heightMm}`;',
          )

          replace_once(
              '        key,\n        width: sectionLayout.width,\n        minPage: pageIndex as 0 | 1,\n        rows: content,',
              '        key,\n        width: sectionLayout.width,\n        packing: "rows",\n        minPage: pageIndex as 0 | 1,\n        rows: content,',
          )

          path.write_text(text)
          PY

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-masonry-renderer-repair.yml
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add src/components/cv/CvCanvasBase.tsx .github/workflows/one-off-masonry-renderer-repair.yml
          git commit -m "fix(cv): preserve renderer while adding masonry"
          git push origin HEAD:dev
