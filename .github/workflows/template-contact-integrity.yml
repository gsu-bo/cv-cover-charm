name: Template Contact Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - dev
      - render
      - main
    paths:
      - "tests/e2e/template-contact-integrity.spec.ts"
      - ".github/workflows/template-contact-integrity.yml"
      - "src/**"

permissions:
  contents: read

concurrency:
  group: template-contact-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  template-contact:
    name: Verify live contact across all 39 templates
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run template contact integrity test
        env:
          E2E_CONTACT_SEED: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: npx playwright test tests/e2e/template-contact-integrity.spec.ts --reporter=line --workers=1

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi
