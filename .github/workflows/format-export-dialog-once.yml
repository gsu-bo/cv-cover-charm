name: Format Export Dialog Once

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/format-export-dialog-once.yml"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/components/dossier/DossierExportDialog.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-export-dialog
          path: src/components/dossier/DossierExportDialog.tsx
          if-no-files-found: error
