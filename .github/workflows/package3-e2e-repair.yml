name: Package 3 E2E Repair

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/package3-e2e-repair.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Align stale browser regressions with current editor ownership
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          path = "tests/e2e/letter-header-modes.spec.ts"
          replace(path,
              '    const layout = await openSection(page, /^Layout$/);\n    const select = layout.locator("[data-letter-header-mode-control]");',
              '    const chrome = await openSection(page, /^Header & Footer$/);\n    const select = chrome.locator("[data-letter-header-mode-control]");')
          replace(path, '    await layout.getByLabel("Name integrieren").uncheck();', '    await chrome.getByLabel("Name integrieren").uncheck();')
          replace(path, '    await layout.getByLabel("Telefon integrieren").uncheck();', '    await chrome.getByLabel("Telefon integrieren").uncheck();')
          replace(path,
              '    const reloadedLayout = await openSection(page, /^Layout$/);\n    await expect(reloadedLayout.locator("[data-letter-header-mode-control]")).toHaveValue("none");',
              '    const reloadedChrome = await openSection(page, /^Header & Footer$/);\n    await expect(reloadedChrome.locator("[data-letter-header-mode-control]")).toHaveValue("none");')
          replace(path,
              '    const layout = await openSection(page, /^Layout$/);\n    const select = layout.locator("[data-letter-footer-mode-control]");',
              '    const chrome = await openSection(page, /^Header & Footer$/);\n    const select = chrome.locator("[data-letter-footer-mode-control]");')
          replace(path,
              '    const reloadedLayout = await openSection(page, /^Layout$/);\n    await expect(reloadedLayout.locator("[data-letter-footer-mode-control]")).toHaveValue("none");',
              '    const reloadedChrome = await openSection(page, /^Header & Footer$/);\n    await expect(reloadedChrome.locator("[data-letter-footer-mode-control]")).toHaveValue("none");')
          replace(path,
              '      const layout = await openSection(page, /^Layout$/);\n      const headerSelect = layout.locator("[data-letter-header-mode-control]");\n      const footerSelect = layout.locator("[data-letter-footer-mode-control]");',
              '      const chrome = await openSection(page, /^Header & Footer$/);\n      const headerSelect = chrome.locator("[data-letter-header-mode-control]");\n      const footerSelect = chrome.locator("[data-letter-footer-mode-control]");')
          replace(path, ').toBe("43mm");', ').toBe("53mm");')

          path = "tests/e2e/cv-card-refresh.spec.ts"
          replace(path,
              '    const typographyToggle = page\n      .locator("[data-editor-section-toggle]")\n      .filter({ hasText: "Schrift und Layout" })\n      .first();\n    await expect(typographyToggle).toBeVisible();\n    await typographyToggle.click();',
              '    const layoutSection = page.locator(\'[data-editor-section-title="Layout"]\');\n    await expect(layoutSection).toHaveCount(1);\n    const layoutToggle = layoutSection.locator("[data-editor-section-toggle]");\n    await expect(layoutToggle).toBeVisible();\n    if ((await layoutToggle.getAttribute("aria-expanded")) !== "true") await layoutToggle.click();')

          replace(
              "tests/e2e/dossier-alignment-regression.spec.ts",
              '  const section = page.locator(\'[data-editor-section-title="Schrift und Layout"]\');',
              '  const section = page.locator(\'[data-editor-section-title="Schrift"]\');',
          )

          path = "tests/e2e/dossier-font-sync.spec.ts"
          replace(path,
              '    const cvTypographySection = page.getByRole("button", { name: /Schrift und Layout/ });',
              '    const cvTypographySection = page.locator(\'[data-editor-section-title="Schrift"] [data-editor-section-toggle]\');')

          path = "tests/e2e/dossier-regression.spec.ts"
          replace(path,
              '    await page.getByRole("button", { name: "Layout", exact: true }).click();\n    await page\n      .locator(\'[data-dossier-chrome-controls="letter"] [data-dossier-header-mode-control]\')\n      .selectOption("compact");',
              '    await page.getByRole("button", { name: "Header & Footer", exact: true }).click();\n    await page\n      .locator(\'[data-dossier-chrome-controls="letter"] [data-dossier-header-mode-control]\')\n      .selectOption("compact");\n    await page.getByRole("button", { name: "Layout", exact: true }).click();')
          replace(path,
              '    await seedCv(page, { layout: "modern" });\n    await page.evaluate(() => {',
              '    await seedCv(page, { layout: "modern" });\n    await page.goto(`${BASE_URL}/`, { waitUntil: "domcontentloaded" });\n    await page.evaluate(() => {')
          replace(path,
              '      localStorage.setItem("lebenslauf:v1", JSON.stringify(saved));\n      window.location.reload();\n    });\n    await page.waitForLoadState("domcontentloaded");',
              '      localStorage.setItem("lebenslauf:v1", JSON.stringify(saved));\n    });\n    await page.goto(`${BASE_URL}/lebenslauf`, { waitUntil: "domcontentloaded" });')

          path = "tests/e2e/dossier-chrome-sync.spec.ts"
          replace(path,
              '  const layout = page.locator("[data-editor-section-toggle]").filter({ hasText: "Layout" }).first();\n  await expect(layout).toBeVisible();\n  if ((await layout.getAttribute("aria-expanded")) !== "true") await layout.click();\n  await expect(layout).toHaveAttribute("aria-expanded", "true");',
              '  const chrome = page\n    .locator("[data-editor-section-toggle]")\n    .filter({ hasText: "Header & Footer" })\n    .first();\n  await expect(chrome).toBeVisible();\n  if ((await chrome.getAttribute("aria-expanded")) !== "true") await chrome.click();\n  await expect(chrome).toHaveAttribute("aria-expanded", "true");')
          replace(path,
              '  test("sync uses one dossier contact source, splits cleanly, and rejoins from the active branch", async ({',
              '  test("sync shares chrome while each active editor keeps its live contact values", async ({')
          replace(path,
              '    await expect(letterHeader).toContainText("Lea Müller");\n    await expect(letterHeader).not.toContainText("Andere Person");',
              '    await expect(letterHeader).toContainText("Andere Person");\n    await expect(letterHeader).not.toContainText("Lea Müller");')
          replace(path,
              '    await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });\n    await expect(page.locator("[data-dossier-integrated-contact]").first()).toContainText(\n      "Lea Müller",\n    );',
              '    await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });\n    await expect(page.locator("[data-letter-page]").first()).toHaveAttribute(\n      "data-letter-header-mode",\n      "contact",\n    );\n    await expect(page.locator("[data-dossier-integrated-contact]").first()).toContainText(\n      "Andere Person",\n    );')
          PY

          bunx prettier --write \
            tests/e2e/letter-header-modes.spec.ts \
            tests/e2e/cv-card-refresh.spec.ts \
            tests/e2e/dossier-alignment-regression.spec.ts \
            tests/e2e/dossier-font-sync.spec.ts \
            tests/e2e/dossier-regression.spec.ts \
            tests/e2e/dossier-chrome-sync.spec.ts

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/letter-header-modes.spec.ts \
            tests/e2e/cv-card-refresh.spec.ts \
            tests/e2e/dossier-alignment-regression.spec.ts \
            tests/e2e/dossier-font-sync.spec.ts \
            tests/e2e/dossier-regression.spec.ts \
            tests/e2e/dossier-chrome-sync.spec.ts
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Align browser regressions with editor ownership"
          git push origin HEAD:dev
