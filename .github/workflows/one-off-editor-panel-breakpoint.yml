name: One-off editor panel breakpoint alignment

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-off-editor-panel-breakpoint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Align responsive route controls
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "src/routes/lebenslauf.tsx": [
                  ('className="absolute inset-0 z-10 bg-foreground/20 sm:hidden"',
                   'className="absolute inset-0 z-10 bg-foreground/20 md:hidden"'),
              ],
              "src/routes/titelblatt.tsx": [
                  ('className="absolute inset-0 z-10 bg-foreground/20 sm:hidden"',
                   'className="absolute inset-0 z-10 bg-foreground/20 md:hidden"'),
              ],
              "src/routes/anschreiben.tsx": [
                  ('className="rounded-md border px-2.5 py-1.5 text-xs font-medium sm:hidden"',
                   'className="rounded-md border px-2.5 py-1.5 text-xs font-medium md:hidden"'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"{filename}: expected exactly one match, found {count}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
      - name: Commit route alignment
        run: |
          rm .github/workflows/one-off-editor-panel-breakpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ui): keep editor panel usable at tablet widths"
          git push origin HEAD:dev
