name: One-off CV page 2 top margin

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/one-off-cv-page2-top-margin.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply page 2 top-margin patch
        run: python3 scripts/one-off-cv-page2-top-margin.py

      - name: Format touched files
        run: |
          bunx prettier --write \
            src/components/cv/layout.ts \
            src/components/cv/CvPageMarginsControl.tsx \
            src/components/cv/archetype.ts \
            src/components/cv/portable-state.ts \
            tests/unit/cv-continuation-spacing.test.ts \
            tests/unit/dossier-header-gap.test.ts

      - name: Targeted regression tests
        run: |
          bun test tests/unit/cv-continuation-spacing.test.ts \
            tests/unit/dossier-header-gap.test.ts \
            tests/unit/dossier-page-margins.test.ts

      - name: TypeScript
        run: bunx tsc --noEmit

      - name: Commit product fix and remove one-off files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/one-off-cv-page2-top-margin.py .github/workflows/one-off-cv-page2-top-margin.yml
          git add -A
          git commit -m "fix(cv): give page 2 an independent top margin"
          git push origin HEAD:dev
