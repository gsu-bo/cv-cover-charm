name: Finish CV refresh cleanup

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-cv-refresh-cleanup-v2.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Clean duplicate pagination dependency
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/components/cv/CvCanvasBase.tsx")
          text = path.read_text()
          lines = text.splitlines()
          start = None
          end = None
          for i in range(len(lines) - 1):
              if lines[i].strip() == "}, [" and lines[i + 1].strip() == "shape,":
                  window = "\n".join(lines[i:i+20])
                  if "measuredAt," in window:
                      start = i
                      for j in range(i + 1, min(i + 25, len(lines))):
                          if lines[j].strip() == "]);":
                              end = j
                              break
                      break
          if start is None or end is None:
              raise SystemExit("pagination dependency array not found")
          block = lines[start:end+1]
          shape_indexes = [idx for idx, line in enumerate(block) if line.strip() == "shape,"]
          if len(shape_indexes) != 2:
              raise SystemExit(f"expected exactly 2 shape dependencies before cleanup, found {len(shape_indexes)}")
          del block[shape_indexes[-1]]
          lines[start:end+1] = block
          cleaned = "\n".join(lines) + ("\n" if text.endswith("\n") else "")
          verify_lines = cleaned.splitlines()
          verify_block = None
          for i in range(len(verify_lines) - 1):
              if verify_lines[i].strip() == "}, [" and verify_lines[i + 1].strip() == "shape,":
                  candidate = "\n".join(verify_lines[i:i+20])
                  if "measuredAt," in candidate:
                      verify_block = candidate
                      break
          if verify_block is None or verify_block.count("shape,") != 1:
              raise SystemExit("cleanup verification failed")
          path.write_text(cleaned)
          PY
          rm -f tests/unit/cv-pagination-shape-invalidation.test.ts
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Focused regressions
        run: bun test tests/unit/cv-refresh-template-scope.test.ts tests/unit/cv-pagination-design-invalidation.test.ts
      - name: TypeScript
        run: bun run typecheck
      - name: Targeted lint
        run: bunx eslint src/components/cv/CvCanvasBase.tsx src/components/cv/CvCanvas.tsx tests/unit/cv-refresh-template-scope.test.ts tests/e2e/cv-card-refresh.spec.ts
      - name: Commit clean final tree
        shell: bash
        run: |
          rm -f .github/workflows/tmp-cv-refresh-cleanup.yml
          rm -f .github/workflows/tmp-cv-refresh-cleanup-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/components/cv/CvCanvasBase.tsx tests/unit/cv-pagination-shape-invalidation.test.ts .github/workflows/tmp-cv-refresh-cleanup.yml .github/workflows/tmp-cv-refresh-cleanup-v2.yml
          git commit -m "chore(cv): remove duplicate refresh dependency"
          git push origin HEAD:dev
