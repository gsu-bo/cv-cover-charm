name: Apply shared CV contact grid fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-cv-contact-shared-grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply narrow shared-grid patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_cv_contact_shared_grid.py')
          text = path.read_text()
          text = text.replace('text.count("data-cv-contact-grid") != 3', 'text.count("data-cv-contact-grid") != 4')
          text = text.replace('expected 3 shared contact grids', 'expected 4 contact-grid markers')
          path.write_text(text)
          PY
          python .github/scripts/apply_cv_contact_shared_grid.py

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Format new regression tests only
        run: bunx prettier --write tests/unit/cv-contact-tabulator.test.ts tests/e2e/dossier-alignment-regression.spec.ts

      - name: Check targeted formatting
        run: bunx prettier --check src/components/cv/CvCanvasBase.tsx tests/unit/cv-contact-tabulator.test.ts tests/e2e/dossier-alignment-regression.spec.ts

      - name: Targeted unit regression
        run: bun test tests/unit/cv-contact-tabulator.test.ts

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Targeted lint
        run: bunx eslint src/components/cv/CvCanvasBase.tsx tests/unit/cv-contact-tabulator.test.ts tests/e2e/dossier-alignment-regression.spec.ts

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-contact-grid.log 2>&1 &
          echo $! > /tmp/cv-contact-grid.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-contact-grid.log
          exit 1

      - name: Browser geometry regression
        run: npx playwright test tests/e2e/dossier-alignment-regression.spec.ts --grep "CV contact tabulator geometry" --reporter=line --workers=1

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-contact-grid.pid ]; then
            kill "$(cat /tmp/cv-contact-grid.pid)" || true
          fi

      - name: Commit verified product fix and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/tmp-cv-contact-shared-grid.yml
          rm .github/scripts/apply_cv_contact_shared_grid.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(cv): share contact and personal tab stop"
          git push origin HEAD:dev
