name: CV Package 1.5 apply v2

on:
  push:
    branches: [dev]
    paths:
      - ".github/workflows/cv-package15-apply-v2.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Extract and apply prepared Package 1.5 patch
        shell: bash
        run: |
          python <<'PY'
          import subprocess
          from pathlib import Path

          source_commit = "eee99390bfec04ce2726acb834ff85be9d237f0e"
          previous = subprocess.check_output(
              ["git", "show", f"{source_commit}:.github/workflows/inspect-cv-package15.yml"],
              text=True,
          )
          start_marker = "          python <<'PY'\n"
          end_marker = "\n          PY\n"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          body = previous[start:end]
          lines = [line[10:] if line.startswith("          ") else line for line in body.splitlines()]
          patch = "\n".join(lines) + "\n"

          patch = patch.replace(
              "  const layoutChoice = useSyncExternalStore<CvLayoutId>(\n  subscribeCvLayoutChoice,\n  getCvLayoutChoice,\n  () => \"classic\",\n);",
              "  const layoutChoice = useSyncExternalStore<CvLayoutId>(\n    subscribeCvLayoutChoice,\n    getCvLayoutChoice,\n    () => \"classic\",\n  );",
          )
          patch = patch.replace(
              'const layout = useSyncExternalStore(subscribeCvLayout, getCvLayout, () => "classic");',
              'const layout = useSyncExternalStore<"classic" | "modern">(subscribeCvLayout, getCvLayout, () => "classic");',
          )

          old_helper = (
              "def replace(path: str, old: str, new: str):\n"
              "    p = Path(path)\n"
              "    text = p.read_text()\n"
              "    if old not in text:\n"
              "        raise SystemExit(f\"expected snippet missing in {path}: {old[:100]!r}\")\n"
              "    p.write_text(text.replace(old, new, 1))\n"
          )
          new_helper = (
              "def replace(path: str, old: str, new: str):\n"
              "    import re\n"
              "    p = Path(path)\n"
              "    text = p.read_text()\n"
              "    if old in text:\n"
              "        p.write_text(text.replace(old, new, 1))\n"
              "        return\n"
              "    lines = old.splitlines()\n"
              "    parts = []\n"
              "    for line in lines:\n"
              "        stripped = line.strip()\n"
              "        parts.append(r'[ \\t]*' + (re.escape(stripped) if stripped else '') + r'[ \\t]*')\n"
              "    pattern = r'\\n'.join(parts)\n"
              "    match = re.search(pattern, text)\n"
              "    if not match:\n"
              "        raise SystemExit(f\"expected snippet missing in {path}: {old[:100]!r}\")\n"
              "    p.write_text(text[:match.start()] + new + text[match.end():])\n"
          )
          if old_helper not in patch:
              raise SystemExit("prepared patch helper not found")
          patch = patch.replace(old_helper, new_helper, 1)
          Path("/tmp/package15_patch.py").write_text(patch)
          PY
          python /tmp/package15_patch.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run targeted Package 1.5 checks
        run: |
          bun test tests/unit/cv-top-area-package15.test.ts tests/unit/cv-top-area-package1.test.ts tests/unit/cv-layout.test.ts
          bun run typecheck
          bun run build

      - name: Commit focused Package 1.5 implementation
        shell: bash
        run: |
          git config user.name "cv-package15-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/cv/photo-place.ts src/components/cv/layout.ts src/components/cv/portable-state.ts src/components/cv/CvForm.tsx src/components/cv/CvCanvasBase.tsx src/components/cv/layout-options.css tests/unit/cv-top-area-package15.test.ts
          git diff --cached --check
          git commit -m "feat(cv): decouple photo and info positioning"
          git push origin HEAD:dev
