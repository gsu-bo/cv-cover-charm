name: Senior default hardening

on:
  push:
    branches:
      - dev
    paths:
      - .github/scripts/senior-default-hardening.py
      - .github/scripts/senior-default-hardening-followup.py
      - .github/workflows/senior-default-hardening.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply senior-review fixes
        run: |
          python .github/scripts/senior-default-hardening.py
          python .github/scripts/senior-default-hardening-followup.py

      - name: Format touched files
        run: >-
          bunx prettier@3.8.3 --write
          src/components/cover/types.ts
          src/default-config.ts
          src/components/letter/types.ts
          src/components/cv/archetype.ts
          src/lib/dossier-chrome.ts
          src/components/letter/layout-system.ts
          src/components/letter/LetterCanvas.tsx
          tests/unit/dossier-canonical-default.test.ts
          tests/unit/letter-brief-default.test.tsx

      - name: Guard fake Brief casts
        run: |
          if git grep -n -E '"brief" as TemplateId|CANONICAL_DOSSIER_PRESENTATION\.template as TemplateId' -- src; then
            echo "Found a remaining fake Brief TemplateId cast"
            exit 1
          fi

      - name: Focused regression
        run: |
          bun test \
            tests/unit/dossier-canonical-default.test.ts \
            tests/unit/letter-brief-default.test.tsx \
            tests/unit/dossier-chrome-sync.test.ts \
            tests/unit/dossier-page-margins.test.ts \
            tests/unit/dossier-sheet-background.test.tsx \
            tests/unit/template-chrome.test.ts \
            tests/unit/templatefix-edge-consistency.test.ts
          bun run typecheck

      - name: Commit product hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dossier): harden canonical Brief defaults"
          git push origin HEAD:dev
