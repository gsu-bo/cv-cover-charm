name: One-off page-fit state migration

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/one-off-page-fit-action.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/one-off-page-fit-patch.py
      - name: Commit migration
        run: |
          rm .github/workflows/one-off-page-fit-action.yml
          rm scripts/one-off-page-fit-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(cv): make page-fit actions one-shot"
          git push origin HEAD:dev
