name: Temporary toolbar transform validation

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
      - name: Add focused viewport regression
        shell: bash
        run: |
          cat > tests/e2e/temp-toolbar-transform.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          const BASE_URL = "http://127.0.0.1:4173";

          test("selection toolbar uses viewport coordinates without breaking formatting", async ({ page }) => {
            await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });
            await expect(page.getByRole("button", { name: "Download", exact: true })).toHaveAttribute(
              "data-editor-ready",
              "true",
              { timeout: 15_000 },
            );

            const panel = page.locator("[data-editor-panel]");
            await expect(panel).toBeVisible();
            expect(await panel.evaluate((element) => getComputedStyle(element).transform)).toBe("none");

            const editor = page.getByRole("textbox", { name: "Brieftext" });
            await editor.scrollIntoViewIfNeeded();
            await editor.evaluate((element) => {
              element.innerHTML =
                "<div>Floating Toolbar Testtext mit genügend Länge.</div><div>Zweiter Absatz.</div>";
              element.dispatchEvent(
                new InputEvent("input", { bubbles: true, inputType: "insertText" }),
              );
            });
            await expect(editor).toContainText("Floating Toolbar Testtext");

            await editor.evaluate((element) => {
              const block = element.firstElementChild;
              if (!block) throw new Error("Brieftext-Testblock fehlt");
              const range = document.createRange();
              range.selectNodeContents(block);
              const selection = window.getSelection();
              selection?.removeAllRanges();
              selection?.addRange(range);
              element.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
            });

            const toolbar = page.locator("[data-letter-selection-toolbar]");
            await expect(toolbar).toBeVisible();

            const geometry = await page.evaluate(() => {
              const toolbar = document.querySelector<HTMLElement>("[data-letter-selection-toolbar]");
              const selection = window.getSelection();
              if (!toolbar || !selection?.rangeCount) throw new Error("Toolbar/Selection fehlt");
              const toolbarRect = toolbar.getBoundingClientRect();
              const selectionRect = selection.getRangeAt(0).getBoundingClientRect();
              return {
                toolbarLeft: toolbarRect.left,
                toolbarRight: toolbarRect.right,
                toolbarTop: toolbarRect.top,
                toolbarBottom: toolbarRect.bottom,
                toolbarCenter: toolbarRect.left + toolbarRect.width / 2,
                selectionTop: selectionRect.top,
                selectionBottom: selectionRect.bottom,
                selectionCenter: selectionRect.left + selectionRect.width / 2,
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
              };
            });

            expect(geometry.toolbarLeft).toBeGreaterThanOrEqual(8);
            expect(geometry.toolbarRight).toBeLessThanOrEqual(geometry.viewportWidth - 8);
            expect(geometry.toolbarTop).toBeGreaterThanOrEqual(8);
            expect(geometry.toolbarBottom).toBeLessThanOrEqual(geometry.viewportHeight - 8);
            expect(Math.abs(geometry.toolbarCenter - geometry.selectionCenter)).toBeLessThanOrEqual(2);
            const verticalGap = Math.min(
              Math.abs(geometry.selectionTop - geometry.toolbarBottom),
              Math.abs(geometry.toolbarTop - geometry.selectionBottom),
            );
            expect(verticalGap).toBeGreaterThanOrEqual(8);
            expect(verticalGap).toBeLessThanOrEqual(12);

            await toolbar.getByRole("button", { name: "Fett", exact: true }).click();
            await expect(editor.locator("strong")).toContainText("Floating Toolbar Testtext");
          });
          EOF
      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm-toolbar.log 2>&1 &
          echo $! > /tmp/cv-cover-charm-toolbar.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-cover-charm-toolbar.log
          exit 1
      - name: Existing rich-text regression
        run: >-
          npx playwright test tests/e2e/dossier-regression.spec.ts
          --grep "letter layout controls and Word-like formatting persist"
          --reporter=line --workers=1
      - name: Focused toolbar geometry regression
        run: npx playwright test tests/e2e/temp-toolbar-transform.spec.ts --reporter=line --workers=1
      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm-toolbar.pid ]; then
            kill "$(cat /tmp/cv-cover-charm-toolbar.pid)" || true
          fi
