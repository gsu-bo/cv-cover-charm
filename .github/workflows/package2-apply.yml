name: Package 2 Apply

on:
  push:
    branches:
      - dev
    paths:
      - ".github/package2_apply.py"
      - ".github/package2_type_fix.py"
      - ".github/package2_e2e_fix.py"
      - ".github/workflows/package2-apply.yml"

permissions:
  contents: write

concurrency:
  group: package2-apply-dev
  cancel-in-progress: false

jobs:
  apply-and-verify:
    name: Apply and verify shared editor controls
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout exact dev trigger
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify branch did not move before work
        shell: bash
        run: |
          git fetch origin dev
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/dev)" = "${GITHUB_SHA}"

      - name: Apply Package 2 source changes
        run: python3 .github/package2_apply.py

      - name: Apply CV margin adapter type correction
        run: python3 .github/package2_type_fix.py

      - name: Harden Package 1 browser regression assertions
        run: python3 .github/package2_e2e_fix.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Format Package 2 files
        run: >-
          bunx prettier --write
          src/routes/lebenslauf.tsx
          src/routes/anschreiben.tsx
          src/components/letter/LetterLayoutControls.tsx
          src/components/cv/CvPageMarginsControl.tsx
          tests/unit/shared-editor-controls-consistency.test.ts
          tests/e2e/shared-editor-controls-consistency.spec.ts
          tests/e2e/dossier-motif-parity.spec.ts

      - name: Run focused unit tests including Package 1 regression
        run: >-
          bun test
          tests/unit/shared-editor-controls-consistency.test.ts
          tests/unit/dossier-motif-parity.test.tsx

      - name: TypeScript
        run: bun run typecheck

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm-package2.log 2>&1 &
          echo $! > /tmp/cv-cover-charm-package2.pid

          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/cv-cover-charm-package2.log
          exit 1

      - name: Run targeted browser verification including Package 1 regression
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: >-
          npx playwright test
          tests/e2e/shared-editor-controls-consistency.spec.ts
          tests/e2e/dossier-motif-parity.spec.ts
          --reporter=line
          --workers=1

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm-package2.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm-package2.pid ]; then
            kill "$(cat /tmp/cv-cover-charm-package2.pid)" || true
          fi

      - name: Verify dev still points at trigger commit
        shell: bash
        run: |
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "${GITHUB_SHA}"

      - name: Commit verified Package 2 and remove temporary runner
        shell: bash
        run: |
          rm .github/package2_apply.py .github/package2_type_fix.py .github/package2_e2e_fix.py .github/workflows/package2-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Align shared CV and letter editor controls"
          git push origin HEAD:dev
