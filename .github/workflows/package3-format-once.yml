name: Package 3 Format Once

on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/package3-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Normalize layout-system formatting
        run: bunx prettier@3.8.3 --write src/components/letter/layout-system.ts
      - name: Commit formatting and remove helper
        run: |
          rm .github/workflows/package3-format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter/layout-system.ts .github/workflows/package3-format-once.yml
          git diff --cached --quiet && exit 0
          git commit -m "Normalize Letter layout-system formatting"
          git push origin HEAD:dev
