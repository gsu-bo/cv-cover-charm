name: Apply canonical Brief default

on:
  push:
    branches:
      - dev
    paths:
      - .github/scripts/apply-canonical-brief-default.py
      - .github/workflows/canonical-brief-default.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply canonical neutral fallback
        run: python .github/scripts/apply-canonical-brief-default.py

      - name: Route remaining implicit fallbacks through Brief
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"patch target missing in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, count))

          replace(
              "src/routes/anschreiben.tsx",
              'import { FONT_LABELS, TEMPLATES, type FontKey } from "@/components/cover/types";\n',
              'import { FONT_LABELS, TEMPLATES, type FontKey } from "@/components/cover/types";\nimport { DEFAULTS } from "@/default-config";\n',
          )
          replace(
              "src/routes/anschreiben.tsx",
              'TEMPLATES.find((candidate) => candidate.id === design.template) ?? TEMPLATES[0]',
              'TEMPLATES.find((candidate) => candidate.id === design.template) ??\n            TEMPLATES.find((candidate) => candidate.id === DEFAULTS.TEMPLATE) ??\n            null',
          )

          replace(
              "src/routes/lebenslauf.tsx",
              'import { PDF, PREVIEW, SHAPE } from "@/default-config";',
              'import { DEFAULTS, PDF, PREVIEW, SHAPE } from "@/default-config";',
          )
          replace(
              "src/routes/lebenslauf.tsx",
              'TEMPLATES.find((x) => x.id === template) ?? TEMPLATES[0]',
              'TEMPLATES.find((x) => x.id === template) ??\n    TEMPLATES.find((x) => x.id === DEFAULTS.TEMPLATE)!',
          )
          replace(
              "src/routes/lebenslauf.tsx",
              'TEMPLATES.find((t) => t.id === design.template) ?? TEMPLATES[0]',
              'TEMPLATES.find((t) => t.id === design.template) ??\n      TEMPLATES.find((t) => t.id === DEFAULTS.TEMPLATE)!',
          )

          replace(
              "src/lib/dossier-family.ts",
              'import type { TemplateId } from "@/components/cover/types";\n',
              'import type { TemplateId } from "@/components/cover/types";\nimport { DEFAULTS } from "@/default-config";\n',
          )
          replace(
              "src/lib/dossier-family.ts",
              'const TEMPLATE_FAMILY: Record<string, DossierFamilyId> = {\n  klassisch: "editorial",',
              'const TEMPLATE_FAMILY: Record<string, DossierFamilyId> = {\n  brief: "classic",\n  klassisch: "editorial",',
          )
          replace(
              "src/lib/dossier-family.ts",
              '  return TEMPLATE_FAMILY[template as string] ?? "modern";',
              '  return (\n    TEMPLATE_FAMILY[template as string] ??\n    TEMPLATE_FAMILY[DEFAULTS.TEMPLATE as string] ??\n    "classic"\n  );',
          )
          replace(
              "src/lib/dossier-family.ts",
              'export function getDossierFamily(template: TemplateId = "modern"): DossierFamilyId {',
              'export function getDossierFamily(template: TemplateId = DEFAULTS.TEMPLATE): DossierFamilyId {',
          )
          PY

      - name: Audit implicit renderer fallbacks
        run: |
          echo "Remaining renderer fallback candidates:"
          if grep -R -n -E 'TEMPLATES\[0\]|\?\? "modern"|\|\| "modern"|defaultTemplate|fallbackTemplate' src; then
            echo "Implicit renderer fallback remains."
            exit 1
          fi

      - name: Format changed source and tests
        run: >-
          npx --yes prettier@3.8.3 --write
          src/lib/dossier-default-presentation.ts
          src/default-config.ts
          src/lib/dossier-chrome.ts
          src/lib/template-chrome.ts
          src/components/cover/TemplatePicker.tsx
          src/components/letter/types.ts
          src/components/letter/LetterCanvas.tsx
          src/components/cv/layout.ts
          src/routes/anschreiben.tsx
          src/routes/lebenslauf.tsx
          src/lib/dossier-family.ts
          src/lib/dossier.ts
          src/lib/dossier-pdf-document.ts
          tests/unit/letter-brief-default.test.tsx
          tests/unit/dossier-canonical-default.test.ts

      - name: Commit canonical fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dossier): canonicalize neutral Brief defaults"
          git push origin HEAD:dev
