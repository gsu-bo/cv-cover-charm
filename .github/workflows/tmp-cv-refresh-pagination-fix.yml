name: Apply CV refresh pagination fix

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-cv-refresh-pagination-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch pagination invalidation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/components/cv/CvCanvasBase.tsx")
          text = path.read_text()
          old = '''    pal.accent,
              pal.ink,
              pal.muted,
              measuredAt,
            ]);
          '''
          new = '''    pal.accent,
              pal.ink,
              pal.muted,
              measuredAt,
              shape,
            ]);
          '''
          if text.count(old) != 1:
              raise SystemExit(f"pagination dependency block: expected 1 match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1))

          test_path = Path("tests/unit/cv-pagination-shape-invalidation.test.ts")
          test_path.write_text('''import { expect, test } from "bun:test";
          import { readFileSync } from "node:fs";

          const source = readFileSync("src/components/cv/CvCanvasBase.tsx", "utf8");

          test("persisted CV layout sidecars invalidate cached pagination after hydration", () => {
            expect(source).toContain("const shape =");
            expect(source).toContain("|photo:${photoPosition}|info:${infoPosition}|");
            expect(source).toContain("|${placementShape}|${sectionLayoutShape}|");
            expect(source).toMatch(/pal\\.muted,\\s*measuredAt,\\s*shape,\\s*\\]\\);/);
          });
          ''')
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format focused regression
        run: bunx prettier --write tests/unit/cv-pagination-shape-invalidation.test.ts

      - name: Check focused formatting
        run: bunx prettier --check src/components/cv/CvCanvasBase.tsx tests/unit/cv-pagination-shape-invalidation.test.ts

      - name: Focused unit regression
        run: bun test tests/unit/cv-pagination-shape-invalidation.test.ts tests/unit/cv-pagination-design-invalidation.test.ts

      - name: TypeScript
        run: bun run typecheck

      - name: Targeted lint
        run: bunx eslint src/components/cv/CvCanvasBase.tsx tests/unit/cv-pagination-shape-invalidation.test.ts

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-cv-refresh-pagination-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cv/CvCanvasBase.tsx tests/unit/cv-pagination-shape-invalidation.test.ts .github/workflows/tmp-cv-refresh-pagination-fix.yml
          git commit -m "fix(cv): repaginate persisted layout on refresh"
          git push origin HEAD:dev
