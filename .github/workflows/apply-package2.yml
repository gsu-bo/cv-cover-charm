name: Apply Package 2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-package2.yml

permissions:
  contents: write

concurrency:
  group: apply-package2-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify untouched Package 1.5 base
        shell: bash
        run: >-
          git diff --quiet
          20abe5b37ecb2ee6697608ce66596251c0a22e25 HEAD -- .
          ':(exclude).github/workflows/apply-package2.yml'
          ':(exclude).github/apply-package2.py'

      - name: Apply Package 2
        run: python3 .github/apply-package2.py

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted Package 2 tests
        run: >-
          bun test
          tests/unit/dossier-package2.test.tsx
          tests/unit/cv-continuation-header.test.tsx
          tests/unit/dossier-chrome-customization.test.tsx

      - name: TypeScript
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit Package 2
        shell: bash
        run: |
          git config user.name "modebrecht"
          git config user.email "137332207+modebrecht@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat(dossier): add explicit continuation header controls"
          git push origin HEAD:dev
