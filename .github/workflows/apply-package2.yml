name: Apply Package 2

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/apply-package2.yml

permissions:
  contents: write

concurrency:
  group: apply-package2-dev
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Package 1.5 baseline
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = "20abe5b37ecb2ee6697608ce66596251c0a22e25"
      - name: Apply Package 2
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          def load(path):
              return Path(path).read_text()

          def save(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          path = "src/lib/dossier-chrome.ts"
          s = load(path)
          s = replace_once(
              s,
              'const isRecord = (value: unknown): value is Record<string, unknown> =>\n  !!value && typeof value === "object" && !Array.isArray(value);\n',
              'const isRecord = (value: unknown): value is Record<string, unknown> =>\n  !!value && typeof value === "object" && !Array.isArray(value);\nconst hasOwn = (value: Record<string, unknown>, key: string) =>\n  Object.prototype.hasOwnProperty.call(value, key);\n',
              "dossier-chrome hasOwn",
          )
          s = replace_once(
              s,
              '  /** Word-like first-page behavior for templates that explicitly use shared chrome. */\n  headerDifferentFirstPage?: boolean;\n  headerHeightMm: number | null;\n',
              '  /** Word-like first-page behavior for templates that explicitly use shared chrome. */\n  headerDifferentFirstPage?: boolean;\n  /** Explicit page-2+ header. Missing means the exact legacy continuation behavior. */\n  headerContinuationMode?: DossierHeaderMode;\n  headerHeightMm: number | null;\n',
              "dossier-chrome type",
          )
          s = replace_once(
              s,
              '    headerDifferentFirstPage:\n      typeof value.headerDifferentFirstPage === "boolean"\n        ? value.headerDifferentFirstPage\n        : (fallback.headerDifferentFirstPage ?? true),\n    headerHeightMm: normalizedMm(value.headerHeightMm, 1, 40),\n',
              '    headerDifferentFirstPage:\n      typeof value.headerDifferentFirstPage === "boolean"\n        ? value.headerDifferentFirstPage\n        : (fallback.headerDifferentFirstPage ?? true),\n    headerContinuationMode: hasOwn(value, "headerContinuationMode")\n      ? value.headerContinuationMode === "compact" ||\n        value.headerContinuationMode === "contact" ||\n        value.headerContinuationMode === "none"\n        ? value.headerContinuationMode\n        : undefined\n      : fallback.headerContinuationMode,\n    headerHeightMm: normalizedMm(value.headerHeightMm, 1, 40),\n',
              "dossier-chrome normalize continuation",
          )
          s = replace_once(
              s,
              '      headerDifferentFirstPage: design.headerDifferentFirstPage,\n      headerHeightMm: design.headerHeightMm,\n',
              '      headerDifferentFirstPage: design.headerDifferentFirstPage,\n      headerContinuationMode: design.headerContinuationMode,\n      headerHeightMm: design.headerHeightMm,\n',
              "dossier-chrome legacy load",
          )
          s = replace_once(
              s,
              '      design.headerDifferentFirstPage === (options.headerDifferentFirstPage ?? true) &&\n      design.headerHeightMm === options.headerHeightMm &&\n',
              '      design.headerDifferentFirstPage === (options.headerDifferentFirstPage ?? true) &&\n      design.headerContinuationMode === options.headerContinuationMode &&\n      design.headerHeightMm === options.headerHeightMm &&\n',
              "dossier-chrome legacy compare",
          )
          s = replace_once(
              s,
              '        headerDifferentFirstPage: options.headerDifferentFirstPage ?? true,\n        headerHeightMm: options.headerHeightMm,\n',
              '        headerDifferentFirstPage: options.headerDifferentFirstPage ?? true,\n        headerContinuationMode: options.headerContinuationMode,\n        headerHeightMm: options.headerHeightMm,\n',
              "dossier-chrome legacy mirror",
          )
          old_helpers = '''/** Contact remains contact on continuation pages; only its visual treatment reduces. */
export function effectiveDossierHeaderModeForOptions(
  options: DossierChromeOptions,
  _pageIndex = 0,
): DossierHeaderMode {
  return options.headerMode;
}

export function hasReducedContinuationHeader(
  options: { headerMode?: string; headerDifferentFirstPage?: boolean },
  pageIndex: number,
): boolean {
  return (
    pageIndex > 0 && options.headerDifferentFirstPage !== false && options.headerMode === "contact"
  );
}

export function dossierHeaderVisualHeightMmForOptions(
  options: DossierChromeOptions,
  pageIndex = 0,
): number {
  if (options.headerMode === "none") return 0;

  const custom = options.headerHeightMm;
  if (hasReducedContinuationHeader(options, pageIndex)) {
    return custom === null ? 8 : Math.min(18, Math.max(5, custom));
  }

  const mode = effectiveDossierHeaderModeForOptions(options, pageIndex);
  if (mode === "contact") return custom === null ? 22 : Math.min(40, Math.max(10, custom));
  if (mode === "compact") return custom === null ? 3 : Math.min(18, Math.max(1, custom));
  return 0;
}

export function dossierHeaderContentTopMmForOptions(
  options: DossierChromeOptions,
  pageIndex = 0,
): number {
  const mode = effectiveDossierHeaderModeForOptions(options, pageIndex);
  if (mode === "none") return pageIndex > 0 ? 16 : 18;

  const height = dossierHeaderVisualHeightMmForOptions(options, pageIndex);
  const gap = Math.min(40, Math.max(0, options.headerGapMm ?? 12));
  if (pageIndex > 0 && options.headerDifferentFirstPage !== false) {
    const base =
      options.headerMode === "contact" ? Math.max(18, height + 10) : Math.max(18, height + 15);
    return base + gap;
  }
  const base = mode === "contact" ? Math.max(18, height + 9) : Math.max(18, height + 18);
  return base + gap;
}
'''
