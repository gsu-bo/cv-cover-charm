name: Final dossier acceptance patch

on:
  push:
    branches:
      - dev
    paths:
      - "scripts/apply-letter-pagination-qa.py"
      - ".github/workflows/apply-letter-pagination-qa.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply final acceptance patch
        run: python3 scripts/apply-letter-pagination-qa.py

      - name: Harden multipage QA locators
        run: |
          python3 - <<'PY'
          from pathlib import Path

          for filename in (
              "tests/e2e/letter-final-qa.spec.ts",
              "tests/e2e/letter-adversarial-content.spec.ts",
          ):
              path = Path(filename)
              text = path.read_text(encoding="utf-8")
              old = 'const preview = page.getByLabel("Vorschau Motivationsschreiben");'
              new = 'const preview = page.locator("main [data-letter-document-root] [data-letter-page]").first();'
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{filename}: expected one preview locator, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          route = Path("src/routes/anschreiben.tsx")
          text = route.read_text(encoding="utf-8")
          old = "[chromeState.sync, data, source],"
          new = "[chromeState.sync, data],"
          count = text.count(old)
          if count != 1:
              raise RuntimeError(f"anschreiben.tsx: expected one memo dependency list, found {count}")
          route.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: >-
          bunx prettier --write
          src/routes/anschreiben.tsx
          src/lib/dossier-pdf.ts
          src/components/dossier/DossierChromeControls.tsx
          src/components/cv/CvCanvasBase.tsx
          tests/e2e/dossier-chrome-sync.spec.ts
          tests/e2e/letter-final-qa.spec.ts
          tests/e2e/letter-adversarial-content.spec.ts
          tests/e2e/dossier-regression.spec.ts
          tests/e2e/dossier-letter-preflight.spec.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Chrome sync acceptance
        run: npx playwright test tests/e2e/dossier-chrome-sync.spec.ts --reporter=line --workers=1

      - name: Responsive editor acceptance
        run: npx playwright test tests/e2e/dossier-responsive-product-smoke.spec.ts --reporter=line --workers=1

      - name: Multi-page edge acceptance
        run: npx playwright test tests/e2e/letter-adversarial-content.spec.ts --reporter=line --workers=1

      - name: Multi-page final QA acceptance
        run: npx playwright test tests/e2e/letter-final-qa.spec.ts --grep "long but one-page|multi-page-sized" --reporter=line --workers=1

      - name: Dossier letter acceptance
        run: >-
          npx playwright test
          tests/e2e/dossier-letter-preflight.spec.ts
          tests/e2e/dossier-alignment-regression.spec.ts
          tests/e2e/dossier-regression.spec.ts
          --grep "missing fields, multi-page|motivation letter (left|justify)|standalone Motivationsschreiben PDF|paginates long content|letter layout controls"
          --reporter=line --workers=1

      - name: Commit verified fixes and remove temporary patch runners
        shell: bash
        run: |
          git fetch origin dev
          if [ "$(git rev-parse origin/dev)" != "$GITHUB_SHA" ]; then
            echo "dev moved while final acceptance was running; refusing to overwrite newer work"
            exit 1
          fi

          rm -f \
            .github/workflows/apply-letter-pagination-qa.yml \
            .github/workflows/apply-letter-pagination.yml \
            scripts/apply-letter-pagination-qa.py \
            scripts/apply-letter-pagination.py \
            scripts/fix-pagination-test.py \
            scripts/fix-pagination-unit.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- \
            src/routes/anschreiben.tsx \
            src/lib/dossier-pdf.ts \
            src/components/dossier/DossierChromeControls.tsx \
            src/components/cv/CvCanvasBase.tsx \
            tests/e2e/dossier-chrome-sync.spec.ts \
            tests/e2e/letter-final-qa.spec.ts \
            tests/e2e/letter-adversarial-content.spec.ts \
            tests/e2e/dossier-regression.spec.ts \
            tests/e2e/dossier-letter-preflight.spec.ts \
            .github/workflows/apply-letter-pagination-qa.yml \
            .github/workflows/apply-letter-pagination.yml \
            scripts/apply-letter-pagination-qa.py \
            scripts/apply-letter-pagination.py \
            scripts/fix-pagination-test.py \
            scripts/fix-pagination-unit.py
          git commit -m "fix(dossier): close final multipage acceptance gaps"
          git push origin HEAD:dev

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi