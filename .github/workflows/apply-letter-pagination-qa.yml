name: Final dossier acceptance patch

on:
  push:
    branches:
      - dev
    paths:
      - "scripts/apply-letter-pagination-qa.py"
      - ".github/workflows/apply-letter-pagination-qa.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact dev head
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply final acceptance patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/apply-letter-pagination-qa.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "const style = getComputedStyle(element);",
              "const style = window.getComputedStyle(element);",
          )
          text = text.replace(
              '''  await expect(preview).toBeVisible();
          await expect(exported).toHaveCount(1);
          return { preview, exported };''',
              '''  await expect(preview).toBeVisible();
          await expect(exported).toHaveCount(1);
          await page.evaluate(
            () =>
              new Promise<void>((resolve) =>
                requestAnimationFrame(() => requestAnimationFrame(() => resolve())),
              ),
          );
          return { preview, exported, download };''',
          )
          text = text.replace(
              '''  await expect.poll(() => exported.count(), { timeout: 20_000 }).toBeGreaterThan(0);
          return { preview, exported };''',
              '''  await expect.poll(() => exported.count(), { timeout: 20_000 }).toBeGreaterThan(0);
          await page.evaluate(
            () =>
              new Promise<void>((resolve) =>
                requestAnimationFrame(() => requestAnimationFrame(() => resolve())),
              ),
          );
          return { preview, exported, download };''',
          )
          text = text.replace(
              '''const { exported } = await seedLetter(page, {
                body: HUGE_BODY,
                footerMode: "attachments",
                attachments: ["Lebenslauf", "Zeugnisse"],
              });''',
              '''const { exported } = await seedLetter(page, payload({ body: HUGE_BODY }));''',
          )
          path.write_text(text, encoding="utf-8")
          PY
          python3 scripts/apply-letter-pagination-qa.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format touched files
        run: >-
          bunx prettier --write
          src/routes/anschreiben.tsx
          src/lib/dossier-pdf.ts
          src/components/dossier/DossierChromeControls.tsx
          src/components/cv/CvCanvasBase.tsx
          tests/e2e/letter-final-qa.spec.ts
          tests/e2e/letter-adversarial-content.spec.ts
          tests/e2e/dossier-regression.spec.ts
          tests/e2e/dossier-letter-preflight.spec.ts

      - name: Unit tests
        run: bun test tests/unit

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install Playwright
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Chrome sync acceptance
        run: npx playwright test tests/e2e/dossier-chrome-sync.spec.ts --reporter=line --workers=1

      - name: Responsive editor acceptance
        run: npx playwright test tests/e2e/dossier-responsive-product-smoke.spec.ts --reporter=line --workers=1

      - name: Multi-page edge acceptance
        run: npx playwright test tests/e2e/letter-adversarial-content.spec.ts --reporter=line --workers=1

      - name: Multi-page final QA acceptance
        run: npx playwright test tests/e2e/letter-final-qa.spec.ts --grep "long but one-page|multi-page-sized" --reporter=line --workers=1

      - name: Dossier letter acceptance
        run: >-
          npx playwright test
          tests/e2e/dossier-letter-preflight.spec.ts
          tests/e2e/dossier-alignment-regression.spec.ts
          tests/e2e/dossier-regression.spec.ts
          --grep "missing fields, multi-page|motivation letter (left|justify)|standalone Motivationsschreiben PDF|paginates long content|letter layout controls"
          --reporter=line --workers=1

      - name: Commit verified fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/routes/anschreiben.tsx \
            src/lib/dossier-pdf.ts \
            src/components/dossier/DossierChromeControls.tsx \
            src/components/cv/CvCanvasBase.tsx \
            tests/e2e/letter-final-qa.spec.ts \
            tests/e2e/letter-adversarial-content.spec.ts \
            tests/e2e/dossier-regression.spec.ts \
            tests/e2e/dossier-letter-preflight.spec.ts
          git commit -m "fix(dossier): close final multipage acceptance gaps"
          git push origin HEAD:dev

      - name: Show app log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi
