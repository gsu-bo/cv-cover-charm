name: Apply letter pagination QA

on:
  push:
    branches:
      - dev
    paths:
      - "scripts/apply-letter-pagination-qa.py"
      - ".github/workflows/apply-letter-pagination-qa.yml"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply QA patch
        run: python3 scripts/apply-letter-pagination-qa.py

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Format pagination changes
        run: >-
          bunx prettier --write
          src/lib/dossier-pdf.ts
          tests/e2e/letter-pagination.spec.ts
          tests/e2e/dossier-letter-preflight.spec.ts
          src/components/letter/LetterDocument.tsx
          src/components/letter/letter-page-context.ts
          src/components/letter/letter-pagination.ts
          src/components/letter/letter-pagination.css
          src/routes/anschreiben.tsx
          src/components/dossier/DossierExportDialog.tsx
          src/components/dossier/DossierPdfCanvas.tsx
          .github/workflows/dossier-regression.yml
          package.json

      - name: Unit tests
        run: bun test tests/unit

      - name: Release formatting
        run: bun run format:check:release

      - name: TypeScript
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Production build
        run: bun run build

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm.log 2>&1 &
          echo $! > /tmp/cv-cover-charm.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-cover-charm.log
          exit 1

      - name: Run pagination and adjacent regressions
        run: >-
          npx playwright test
          tests/e2e/letter-pagination.spec.ts
          tests/e2e/dossier-letter-preflight.spec.ts
          tests/e2e/letter-header-modes.spec.ts
          --reporter=line --workers=1

      - name: Commit verified pagination QA
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/lib/dossier-pdf.ts \
            tests/e2e/letter-pagination.spec.ts \
            .github/workflows/dossier-regression.yml \
            package.json
          if git diff --cached --quiet; then
            echo "No QA changes to commit"
            exit 0
          fi
          git commit -m "test(letter): verify multi-page pagination end to end"
          git push origin HEAD:dev

      - name: Upload pagination QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: letter-pagination-qa
          path: artifacts/letter-pagination
          if-no-files-found: warn
          retention-days: 14

      - name: Show application log on failure
        if: failure()
        run: cat /tmp/cv-cover-charm.log || true

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm.pid ]; then
            kill "$(cat /tmp/cv-cover-charm.pid)" || true
          fi
