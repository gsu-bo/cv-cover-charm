name: One-off letter type fix

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Patch TypeScript annotation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/letter/LetterRichTextEditor.tsx')
          text = path.read_text()
          old = '    const parent = current.parentNode;'
          new = '    const parent: ParentNode | null = current.parentNode;'
          if old not in text:
              raise SystemExit('target line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove temporary workflow and commit fix
        run: |
          rm .github/workflows/tmp-fix-letter-parent-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter/LetterRichTextEditor.tsx .github/workflows/tmp-fix-letter-parent-type.yml
          git commit -m "fix(letter): type range bookmark parent node"
          git push origin HEAD:dev
