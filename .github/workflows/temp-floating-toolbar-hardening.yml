name: Temporary floating toolbar hardening

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply focused hardening
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/toolbar_patch.py
          printf '%s' '' | base64 -d > tests/e2e/letter-selection-toolbar-viewport.spec.ts
          python3 /tmp/toolbar_patch.py
          bunx prettier --write src/components/letter/LetterRichTextEditor.tsx tests/unit/letter-selection-toolbar.test.ts tests/e2e/letter-selection-toolbar-viewport.spec.ts .github/workflows/dossier-regression.yml
          bun test tests/unit/letter-selection-toolbar.test.ts
          bun run typecheck
          bun run lint
          bun run build

      - name: Run focused browser regression
        shell: bash
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.55.0
          npx playwright install --with-deps chromium
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm-toolbar.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/anschreiben > /dev/null; then
              break
            fi
            sleep 1
          done
          npx playwright test tests/e2e/letter-selection-toolbar-viewport.spec.ts --reporter=line --workers=1

      - name: Commit hardening and remove temporary runner
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-floating-toolbar-hardening.yml
          git add src/components/letter/LetterRichTextEditor.tsx tests/unit/letter-selection-toolbar.test.ts tests/e2e/letter-selection-toolbar-viewport.spec.ts .github/workflows/dossier-regression.yml
          git commit -m "Harden floating text toolbar positioning"
          git push origin HEAD:dev
