name: Temporary floating toolbar hardening

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Harden floating text toolbar
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          editor = Path("src/components/letter/LetterRichTextEditor.tsx")
          source = editor.read_text()

          old = 'import { useEffect, useRef, useState } from "react";\n'
          new = 'import { useEffect, useRef, useState } from "react";\nimport { createPortal } from "react-dom";\n'
          if old not in source:
              raise SystemExit("React import marker missing")
          source = source.replace(old, new, 1)

          old = '''  const rememberRange = () => {
    const editor = editorRef.current;
    const selection = window.getSelection();
    if (
      !editor ||
      !selection?.rangeCount ||
      !selection.anchorNode ||
      !editor.contains(selection.anchorNode)
    )
      return null;
    const range = selection.getRangeAt(0).cloneRange();
    savedRangeRef.current = range;
    return range;
  };
'''
          new = '''  const rememberRange = () => {
    const editor = editorRef.current;
    const selection = window.getSelection();
    if (!editor || !selection?.rangeCount) return null;
    const liveRange = selection.getRangeAt(0);
    if (
      !editor.contains(liveRange.startContainer) ||
      !editor.contains(liveRange.endContainer)
    ) {
      return null;
    }
    const range = liveRange.cloneRange();
    savedRangeRef.current = range;
    return range;
  };
'''
          if old not in source:
              raise SystemExit("rememberRange marker missing")
          source = source.replace(old, new, 1)

          old = '''    if (
      !editor ||
      !selection?.rangeCount ||
      !selection.anchorNode ||
      !editor.contains(selection.anchorNode)
    ) {
      setSelectionBubble(null);
      return;
    }

    const range = rememberRange();
    if (!range) {
      setSelectionBubble(null);
      return;
    }
'''
          new = '''    if (!editor || !selection?.rangeCount) {
      savedRangeRef.current = null;
      setSelectionBubble(null);
      return;
    }

    const range = rememberRange();
    if (!range) {
      savedRangeRef.current = null;
      setSelectionBubble(null);
      return;
    }
'''
          if old not in source:
              raise SystemExit("toolbar selection guard marker missing")
          source = source.replace(old, new, 1)

          old = '''      {selectionBubble ? (
        <div
          data-letter-selection-toolbar
'''
          new = '''      {selectionBubble && typeof document !== "undefined"
        ? createPortal(
            <div
              data-letter-selection-toolbar
              data-placement={selectionBubble.placement}
'''
          if old not in source:
              raise SystemExit("selection toolbar opening marker missing")
          source = source.replace(old, new, 1)

          old = '''        </div>
      ) : null}
      <div
        data-letter-rich-toolbar
'''
          new = '''            </div>,
            document.body,
          )
        : null}
      <div
        data-letter-rich-toolbar
'''
          if old not in source:
              raise SystemExit("selection toolbar closing marker missing")
          source = source.replace(old, new, 1)
          editor.write_text(source)

          unit = Path("tests/unit/letter-selection-toolbar.test.ts")
          test_source = unit.read_text()
          marker = '  expect(source).toContain("data-letter-selection-toolbar");\n'
          addition = '''  expect(source).toContain('import { createPortal } from "react-dom"');
  expect(source).toContain("document.body");
  expect(source).toContain("editor.contains(liveRange.startContainer)");
  expect(source).toContain("editor.contains(liveRange.endContainer)");
'''
          if marker not in test_source:
              raise SystemExit("selection toolbar unit marker missing")
          if addition not in test_source:
              test_source = test_source.replace(marker, marker + addition, 1)
          unit.write_text(test_source)

          regression = Path(".github/workflows/dossier-regression.yml")
          regression_source = regression.read_text()
          marker = '              tests/e2e/letter-final-qa.spec.ts\n'
          addition = '              tests/e2e/letter-selection-toolbar-viewport.spec.ts\n'
          if marker not in regression_source:
              raise SystemExit("letter browser group marker missing")
          if addition not in regression_source:
              regression_source = regression_source.replace(marker, marker + addition, 1)
          regression.write_text(regression_source)
          PY

          cat > tests/e2e/letter-selection-toolbar-viewport.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          const BASE_URL = "http://127.0.0.1:4173";

          test("floating letter selection toolbar stays in viewport coordinates", async ({ page }) => {
            await page.goto(`${BASE_URL}/anschreiben`, { waitUntil: "domcontentloaded" });
            await expect(page.getByRole("button", { name: "Download", exact: true })).toHaveAttribute(
              "data-editor-ready",
              "true",
              { timeout: 15_000 },
            );

            const editor = page.locator("[data-letter-rich-editor]");
            await editor.scrollIntoViewIfNeeded();
            await expect(editor).toBeVisible();
            await editor.evaluate((element) => {
              element.innerHTML =
                '<div data-align="justify">Floating Toolbar Testtext mit genügend Länge.</div>';
              element.dispatchEvent(
                new InputEvent("input", { bubbles: true, inputType: "insertText" }),
              );

              const block = element.firstElementChild;
              if (!block) throw new Error("Brieftext-Testblock fehlt");
              const range = document.createRange();
              range.selectNodeContents(block);
              const selection = window.getSelection();
              selection?.removeAllRanges();
              selection?.addRange(range);
              element.dispatchEvent(new MouseEvent("mouseup", { bubbles: true }));
            });

            const toolbar = page.locator("[data-letter-selection-toolbar]");
            await expect(toolbar).toBeVisible();
            await expect(toolbar).toHaveAttribute("data-placement", /above|below/);

            expect(
              await toolbar.evaluate((element) => element.parentElement === document.body),
              "toolbar must escape the transformed/resizable editor panel",
            ).toBe(true);

            const geometry = await page.evaluate(() => {
              const toolbar = document.querySelector<HTMLElement>("[data-letter-selection-toolbar]");
              const selection = window.getSelection();
              if (!toolbar || !selection?.rangeCount) throw new Error("Toolbar/Selection fehlt");
              const selectionRect = selection.getRangeAt(0).getBoundingClientRect();
              const toolbarRect = toolbar.getBoundingClientRect();
              return {
                placement: toolbar.dataset.placement,
                selectionTop: selectionRect.top,
                selectionBottom: selectionRect.bottom,
                toolbarTop: toolbarRect.top,
                toolbarRight: toolbarRect.right,
                toolbarBottom: toolbarRect.bottom,
                toolbarLeft: toolbarRect.left,
                viewportWidth: window.innerWidth,
                viewportHeight: window.innerHeight,
              };
            });

            expect(geometry.toolbarLeft).toBeGreaterThanOrEqual(10);
            expect(geometry.toolbarTop).toBeGreaterThanOrEqual(10);
            expect(geometry.toolbarRight).toBeLessThanOrEqual(geometry.viewportWidth - 10);
            expect(geometry.toolbarBottom).toBeLessThanOrEqual(geometry.viewportHeight - 10);

            if (geometry.placement === "above") {
              expect(geometry.selectionTop - geometry.toolbarBottom).toBeGreaterThanOrEqual(8);
              expect(geometry.selectionTop - geometry.toolbarBottom).toBeLessThanOrEqual(14);
            } else {
              expect(geometry.toolbarTop - geometry.selectionBottom).toBeGreaterThanOrEqual(8);
              expect(geometry.toolbarTop - geometry.selectionBottom).toBeLessThanOrEqual(14);
            }

            await toolbar.getByRole("button", { name: "Fett", exact: true }).click();
            await expect(editor.locator("strong")).toContainText("Floating Toolbar Testtext");
          });
          EOF

          bunx prettier --write \
            src/components/letter/LetterRichTextEditor.tsx \
            tests/unit/letter-selection-toolbar.test.ts \
            tests/e2e/letter-selection-toolbar-viewport.spec.ts \
            .github/workflows/dossier-regression.yml

          bun test tests/unit/letter-selection-toolbar.test.ts
          bun run typecheck
          bun run lint

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/letter/LetterRichTextEditor.tsx \
            tests/unit/letter-selection-toolbar.test.ts \
            tests/e2e/letter-selection-toolbar-viewport.spec.ts \
            .github/workflows/dossier-regression.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Harden floating text toolbar positioning"
          git push origin HEAD:dev
