name: Temporary selection E2E patch

on:
  push:
    branches: [dev]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
      - name: Update selection toolbar E2E ownership
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("tests/e2e/dossier-regression.spec.ts"); s=p.read_text(); old="    await selectBlock(0);\n    await page.getByRole(\"button\", { name: \"Fett\" }).click();\n    await page.getByRole(\"button\", { name: \"Kursiv\" }).click();\n    await page.getByRole(\"button\", { name: \"Unterstrichen\" }).click();"; new="    await selectBlock(0);\n    const selectionToolbar = page.locator(\"[data-letter-selection-toolbar]\");\n    await expect(selectionToolbar).toBeVisible();\n    await selectionToolbar.getByRole(\"button\", { name: \"Fett\", exact: true }).click();\n    await selectionToolbar.getByRole(\"button\", { name: \"Kursiv\", exact: true }).click();\n    await selectionToolbar.getByRole(\"button\", { name: \"Unterstrichen\", exact: true }).click();"; assert old in s; s=s.replace(old,new,1); old2="    const toolbarTop = await toolbar\n      .getByRole(\"button\", { name: \"Formatierung entfernen\" })\n      .evaluate((button) => button.getBoundingClientRect().top);"; new2="    const toolbarTop = await toolbar\n      .getByRole(\"button\", { name: \"Linksbündig\" })\n      .evaluate((button) => button.getBoundingClientRect().top);"; assert old2 in s; p.write_text(s.replace(old2,new2,1))'
      - name: Commit test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/dossier-regression.spec.ts
          git diff --cached --quiet && exit 0
          git commit -m "Update selection toolbar regression"
          git push origin HEAD:dev
