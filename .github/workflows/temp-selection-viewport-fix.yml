name: Temporary selection viewport fix

on:
  push:
    branches:
      - dev

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 2
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Clamp selection bubble into viewport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/components/letter/LetterRichTextEditor.tsx")
          source = path.read_text()
          old = '''    const placement: SelectionBubble["placement"] = rect.top >= 64 ? "above" : "below";
    const center = rect.left + rect.width / 2;
    setSelectionBubble({
      left: Math.min(Math.max(center, 92), Math.max(92, window.innerWidth - 92)),
      top: placement === "above" ? rect.top - 10 : rect.bottom + 10,
      placement,
    });
'''
          new = '''    const bubbleGap = 10;
    const bubbleEdge = 12;
    const bubbleHeight = 44;
    const placement: SelectionBubble["placement"] =
      rect.top >= bubbleHeight + bubbleGap + bubbleEdge ? "above" : "below";
    const center = rect.left + rect.width / 2;
    const rawTop = placement === "above" ? rect.top - bubbleGap : rect.bottom + bubbleGap;
    const top =
      placement === "above"
        ? Math.min(
            Math.max(rawTop, bubbleHeight + bubbleEdge),
            Math.max(bubbleHeight + bubbleEdge, window.innerHeight - bubbleEdge),
          )
        : Math.min(
            Math.max(rawTop, bubbleEdge),
            Math.max(bubbleEdge, window.innerHeight - bubbleHeight - bubbleEdge),
          );
    setSelectionBubble({
      left: Math.min(Math.max(center, 92), Math.max(92, window.innerWidth - 92)),
      top,
      placement,
    });
'''
          if old in source:
              path.write_text(source.replace(old, new, 1))

          test = Path("tests/unit/letter-selection-toolbar.test.ts")
          test_source = test.read_text()
          marker = '  expect(source).toContain(\'window.addEventListener("scroll", onSelectionChange, true)\');\n'
          addition = '  expect(source).toContain("window.innerHeight - bubbleEdge");\n  expect(source).toContain("window.innerHeight - bubbleHeight - bubbleEdge");\n'
          if addition not in test_source:
              if marker not in test_source:
                  raise SystemExit("selection toolbar unit marker not found")
              test.write_text(test_source.replace(marker, marker + addition, 1))
          PY
          bunx prettier --write src/components/letter/LetterRichTextEditor.tsx tests/unit/letter-selection-toolbar.test.ts
          bun test tests/unit/letter-selection-toolbar.test.ts
      - name: Commit viewport fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/letter/LetterRichTextEditor.tsx tests/unit/letter-selection-toolbar.test.ts
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clamp selection toolbar to viewport"
          git push origin HEAD:dev
