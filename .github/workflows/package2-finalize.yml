name: Package 2 Finalize

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/package2-finalize.yml"

permissions:
  contents: write

concurrency:
  group: package2-finalize-dev
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply narrow Package 2 ownership correction
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}: {old!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/routes/anschreiben.tsx",
              'import { DossierHyphenationControl } from "@/components/dossier/DossierHyphenationControl";\n',
              "",
          )
          replace_once(
              "src/routes/anschreiben.tsx",
              '              <DossierHyphenationControl />\n\n',
              "",
          )

          unit_path = Path("tests/unit/shared-editor-controls-consistency.test.ts")
          unit = unit_path.read_text(encoding="utf-8")
          old_unit = '''  test("places the historical shared typography control in Schrift in both editors", () => {
    const cvTypography = section(cv, "Schrift");
    const letterTypography = section(letter, "Schrift");
    expect(cvTypography).toContain("<DossierHyphenationControl />");
    expect(letterTypography).toContain("<DossierHyphenationControl />");
    expect(count(cv, /<DossierHyphenationControl\\b/g)).toBe(1);
    expect(count(letter, /<DossierHyphenationControl\\b/g)).toBe(1);
    expect(letterLayout).not.toContain("DossierHyphenationControl");
  });'''
          new_unit = '''  test("keeps typography ownership consistent without leaking CV-only title spacing into Letter", () => {
    const cvTypography = section(cv, "Schrift");
    const letterTypography = section(letter, "Schrift");
    expect(cvTypography).toContain("<DossierHyphenationControl />");
    expect(cvTypography).toContain("Schriftart gesamtes Dossier");
    expect(letterTypography).toContain("Schriftart");
    expect(count(cv, /<DossierHyphenationControl\\b/g)).toBe(1);
    expect(letter).not.toContain("DossierHyphenationControl");
    expect(letterLayout).not.toContain("DossierHyphenationControl");
  });'''
          if unit.count(old_unit) != 1:
              raise SystemExit("unit typography ownership block did not match exactly once")
          unit_path.write_text(unit.replace(old_unit, new_unit, 1), encoding="utf-8")

          e2e_path = Path("tests/e2e/shared-editor-controls-consistency.spec.ts")
          e2e = e2e_path.read_text(encoding="utf-8")
          old_e2e = '''    const typography = await openSection(page, "Schrift");
    await expect(typography.locator("[data-cv-doc-title-margin-top-control]")).toHaveCount(1);

    await page.reload();'''
          new_e2e = '''    const typography = await openSection(page, "Schrift");
    await expect(typography.locator("[data-cv-doc-title-margin-top-control]")).toHaveCount(0);
    await expect(typography.getByRole("combobox", { name: "Schriftart" })).toBeVisible();

    await page.reload();'''
          # The same two-line shape exists in the CV test first. Replace the last occurrence: Letter only.
          if e2e.count(old_e2e) != 2:
              raise SystemExit(f"expected CV + Letter typography blocks, got {e2e.count(old_e2e)}")
          before, sep, after = e2e.rpartition(old_e2e)
          e2e_path.write_text(before + new_e2e + after, encoding="utf-8")

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Targeted unit regressions
        run: bun test tests/unit/shared-editor-controls-consistency.test.ts tests/unit/dossier-motif-parity.test.tsx

      - name: TypeScript
        run: bun run typecheck

      - name: Format touched files
        run: bunx prettier --check src/routes/anschreiben.tsx tests/unit/shared-editor-controls-consistency.test.ts tests/e2e/shared-editor-controls-consistency.spec.ts

      - name: Install browser test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start application
        shell: bash
        run: |
          bun run dev -- --host 127.0.0.1 --port 4173 > /tmp/cv-cover-charm-package2.log 2>&1 &
          echo $! > /tmp/cv-cover-charm-package2.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/lebenslauf > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/cv-cover-charm-package2.log
          exit 1

      - name: Targeted browser regressions
        env:
          E2E_BASE_URL: http://127.0.0.1:4173
        run: npx playwright test tests/e2e/shared-editor-controls-consistency.spec.ts tests/e2e/dossier-motif-parity.spec.ts --reporter=line --workers=1

      - name: Stop application
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/cv-cover-charm-package2.pid ]; then
            kill "$(cat /tmp/cv-cover-charm-package2.pid)" || true
          fi

      - name: Commit verified Package 2 correction
        shell: bash
        run: |
          rm .github/workflows/package2-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/anschreiben.tsx tests/unit/shared-editor-controls-consistency.test.ts tests/e2e/shared-editor-controls-consistency.spec.ts .github/workflows/package2-finalize.yml
          git diff --cached --check
          git commit -m "Finalize Package 2 typography ownership"
          git push origin HEAD:dev
