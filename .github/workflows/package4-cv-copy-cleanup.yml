name: Package 4 CV Copy Cleanup

on:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/package4-cv-copy-cleanup.yml"

permissions:
  contents: write
  statuses: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Apply Package 4 UI-only cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/lebenslauf.tsx")
          source = path.read_text(encoding="utf-8")
          subtitle = '''              <p className="hidden truncate text-xs text-muted-foreground sm:block">\n                Teil deines Bewerbungsdossiers\n              </p>\n'''
          instruction = '''            <div className="px-1">\n              <span className="text-xs text-muted-foreground">Alles ausfüllen, dann als PDF.</span>\n            </div>\n\n'''
          if source.count(subtitle) != 1:
              raise SystemExit(f"Expected one subtitle block, found {source.count(subtitle)}")
          if source.count(instruction) != 1:
              raise SystemExit(f"Expected one instruction block, found {source.count(instruction)}")
          source = source.replace(subtitle, "").replace(instruction, "")
          assert "Teil deines Bewerbungsdossiers" not in source
          assert "Alles ausfüllen, dann als PDF." not in source
          assert '>Lebenslauf</h1>' in source
          assert '<SaveStatus state={saveState} />' in source
          path.write_text(source, encoding="utf-8")
          PY

          cat > tests/unit/cv-editor-copy.test.ts <<'TEST'
          import { describe, expect, test } from "bun:test";
          import { readFileSync } from "node:fs";

          const source = readFileSync("src/routes/lebenslauf.tsx", "utf8");

          describe("CV editor top-area copy", () => {
            test("keeps title and autosave status while removing redundant copy", () => {
              expect(source).toContain('>Lebenslauf</h1>');
              expect(source).toContain('<SaveStatus state={saveState} />');
              expect(source).not.toContain("Teil deines Bewerbungsdossiers");
              expect(source).not.toContain("Alles ausfüllen, dann als PDF.");
            });
          });
          TEST

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted unit test
        run: bun test tests/unit/cv-editor-copy.test.ts

      - name: Targeted formatting check
        run: bunx prettier --check src/routes/lebenslauf.tsx tests/unit/cv-editor-copy.test.ts

      - name: TypeScript typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Commit Package 4
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/package4-cv-copy-cleanup.yml
          git add src/routes/lebenslauf.tsx tests/unit/cv-editor-copy.test.ts
          git diff --cached --check
          git commit -m "fix(cv): remove redundant editor copy"
          git push origin HEAD:dev
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish targeted status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINAL_SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          curl --fail-with-body -sS -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${FINAL_SHA}" \
            -d '{"state":"success","context":"Package 4 targeted QA","description":"Unit, format, typecheck and build passed"}' \
            >/dev/null
