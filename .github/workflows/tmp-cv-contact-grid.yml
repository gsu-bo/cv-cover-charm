name: Apply CV contact grid polish

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-cv-contact-grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - name: Patch CV contact rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/cv/CvCanvasBase.tsx')
          text = path.read_text()

          old = '''  const adresse = [p.adresse, p.plzOrt].filter(Boolean).join(" · ");
          const kontakt = [p.telefon, p.email].filter(Boolean).join(" · ");
          const kontaktZeilen = [adresse, kontakt].filter(Boolean);
          '''
          new = '''  const contactPairs = [
            { key: "address", left: p.adresse, right: p.plzOrt },
            { key: "contact", left: p.telefon, right: p.email },
          ].filter(({ left, right }) => Boolean(left || right));
          '''
          if old not in text:
              raise SystemExit('contact source block not found')
          text = text.replace(old, new, 1)

          anchor = '''  const personalInfoGridStyle = personalInfoAligned
            ? { display: "grid", gridTemplateColumns: "max-content minmax(0, 1fr)", columnGap: "2.5mm" }
            : undefined;
          '''
          helper = '''  const personalInfoGridStyle = personalInfoAligned
            ? { display: "grid", gridTemplateColumns: "max-content minmax(0, 1fr)", columnGap: "2.5mm" }
            : undefined;
          const contactRows = () =>
            contactPairs.map(({ key, left, right }) => {
              if (personalInfoAligned) {
                if (left && right) {
                  return (
                    <Fragment key={key}>
                      <span style={{ minWidth: 0, overflowWrap: "anywhere" }}>{left}</span>
                      <span style={{ minWidth: 0, overflowWrap: "anywhere" }}>{right}</span>
                    </Fragment>
                  );
                }
                return (
                  <div
                    key={key}
                    style={{ gridColumn: "1 / -1", minWidth: 0, overflowWrap: "anywhere" }}
                  >
                    {left || right}
                  </div>
                );
              }
              return (
                <div key={key} style={{ display: "flex", flexWrap: "wrap", columnGap: "2.5mm" }}>
                  {left && <span style={{ minWidth: 0, overflowWrap: "anywhere" }}>{left}</span>}
                  {right && <span style={{ minWidth: 0, overflowWrap: "anywhere" }}>{right}</span>}
                </div>
              );
            });
          '''
          if anchor not in text:
              raise SystemExit('personal info grid anchor not found')
          text = text.replace(anchor, helper, 1)

          text = text.replace('kontaktZeilen.length', 'contactPairs.length')

          old_map_line = '{kontaktZeilen.map((line) => <div key={line} style={{ overflowWrap: "anywhere" }}>{line}</div>)}'
          count_line = text.count(old_map_line)
          if count_line != 2:
              raise SystemExit(f'expected 2 line-map occurrences, found {count_line}')
          text = text.replace(old_map_line, '{contactRows()}')

          old_map_k = '{kontaktZeilen.map((k) => <div key={k} style={{ overflowWrap: "anywhere" }}>{k}</div>)}'
          count_k = text.count(old_map_k)
          if count_k != 1:
              raise SystemExit(f'expected 1 k-map occurrence, found {count_k}')
          text = text.replace(old_map_k, '{contactRows()}')

          # The standalone Kontakt rubric needs its own grid wrapper; the two header
          # variants already have a dedicated contact div we can turn into the grid.
          standalone = '{contactRows()}\n            {angaben.length > 0 && <div data-cv-muted style={{ marginTop: "1mm", color: pal.muted, ...personalInfoGridStyle }}>{personalInfoRows()}</div>}'
          standalone_new = '{contactPairs.length > 0 && <div style={personalInfoGridStyle}>{contactRows()}</div>}\n            {angaben.length > 0 && <div data-cv-muted style={{ marginTop: "1mm", color: pal.muted, ...personalInfoGridStyle }}>{personalInfoRows()}</div>}'
          if standalone not in text:
              raise SystemExit('standalone contact block not found')
          text = text.replace(standalone, standalone_new, 1)

          header1 = 'style={{ marginTop: "2.5mm", fontSize: pt(9.7), color: pal.ink, lineHeight: 1.38 }}>{contactRows()}</div>'
          header1_new = 'style={{ marginTop: "2.5mm", fontSize: pt(9.7), color: pal.ink, lineHeight: 1.38, ...personalInfoGridStyle }}>{contactRows()}</div>'
          if header1 not in text:
              raise SystemExit('classic header contact block not found')
          text = text.replace(header1, header1_new, 1)

          header2 = 'style={{ marginTop: withName ? "2.5mm" : 0, fontSize: pt(9.7), color: pal.ink, lineHeight: 1.38 }}>{contactRows()}</div>'
          header2_new = 'style={{ marginTop: withName ? "2.5mm" : 0, fontSize: pt(9.7), color: pal.ink, lineHeight: 1.38, ...personalInfoGridStyle }}>{contactRows()}</div>'
          if header2 not in text:
              raise SystemExit('compact header contact block not found')
          text = text.replace(header2, header2_new, 1)

          if 'kontaktZeilen' in text or 'join(" · ")' in text:
              raise SystemExit('legacy dotted contact rendering still present')

          path.write_text(text)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format changed source
        run: bunx prettier --write src/components/cv/CvCanvasBase.tsx

      - name: Typecheck
        run: bun run typecheck

      - name: Commit source and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-cv-contact-grid.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/cv/CvCanvasBase.tsx .github/workflows/tmp-cv-contact-grid.yml
          git commit -m "polish(cv): align contact details with tabulator grid"
          git push origin HEAD:dev
