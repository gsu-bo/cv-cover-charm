name: Temporary Prettier Commit

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-prettier-export.yml

permissions:
  contents: write

jobs:
  format-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format release-gated letter files
        run: bunx prettier --write src/components/letter/LetterCanvas.tsx src/components/letter/LetterLayoutControls.tsx
      - name: Commit formatting and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-prettier-export.yml
          git add src/components/letter/LetterCanvas.tsx src/components/letter/LetterLayoutControls.tsx
          git commit -m "style(letter): format release-gated files"
          git push origin HEAD:dev
